<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alma Pura</title>
    <!-- Vinculamos el CSS y el Manifest para la App -->
    <link rel="stylesheet" href="styles_2.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <h1>Alma Pura</h1>
        <button id="btn-abrir-admin">Administrador</button>
    </header>

    <main>
        <!-- Aquí adentro van a aparecer los productos mágicamente -->
        <div class="grid" id="grid-productos"></div>
    </main>

    <!-- Panel Lateral de Administrador -->
    <div id="panel-admin" class="side-panel">
        <div class="panel-content">
            <span id="btn-cerrar-admin" class="close-btn">&times;</span>
            <h2>Agregar Producto</h2>
            
            <label for="img-file" class="file-upload-label">📸 Seleccionar foto</label>
            <input type="file" id="img-file" accept="image/*" class="file-input">
            
            <input type="text" id="input-titulo" placeholder="Título de la prenda">
            <input type="number" id="input-precio" placeholder="Precio ($)">
            
            <button id="btn-agregar-producto">Agregar Producto</button>

            <!-- Historial de Ventas -->
            <div class="sales-log-section">
                <h3>Historial de Ventas</h3>
                <div class="sales-header">
                    <span>Prenda</span>
                    <span>Fecha</span>
                    <span>Precio</span>
                </div>
                <ul id="sales-list"></ul>
                <div class="sales-total">
                    <strong>Recaudado:</strong> <span id="total-month">$0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Librerías de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <!-- Registro del Service Worker (Para que se pueda instalar la App) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('App lista para instalarse'))
                    .catch(err => console.error('Error en PWA', err));
            });
        }
    </script>
    
    <!-- Tu lógica en JS -->
    <script src="app.js"></script>
</body>
</html>
